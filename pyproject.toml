[project]
name = "mediateca-shared"
version = "0.1.0"
description = "Modelos y contratos compartidos de Mediateca Madrid"
requires-python = ">=3.11,<3.15"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediateca_shared"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
